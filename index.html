<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Sifrota Home</title>
</head>
<body class="d-flex align-items-center text-center">

    <div class="bg-shapes">
        <div class="shape-ring-bw"></div>
        <div class="shape-ring-orange"></div>
        <div class="shape-glow"></div>
    </div>

    <button class="btn btn-orange position-absolute top-0 end-0 m-3 glass-effect" onclick="toggleTheme()" style="z-index: 10;">
        🌓 Tema
    </button>

    <div class="container glass-effect p-5 position-relative">
        <h1 class="display-3 mb-5" style="color: var(--text-color); font-weight: bold;">Sifrota <span style="color: var(--accent-orange);">Web</span></h1>
        <div class="row g-3">
            <div class="col-md-4"><a href="marcas.html" class="btn btn-orange btn-lg w-100 p-4 glass-effect">🏢 Marcas</a></div>
            <div class="col-md-4"><a href="modelos.html" class="btn btn-orange btn-lg w-100 p-4 glass-effect">🚘 Modelos</a></div>
            <div class="col-md-4"><a href="veiculos.html" class="btn btn-orange btn-lg w-100 p-4 glass-effect">🚚 Veículos</a></div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('sifrota_theme', newTheme);
        }
        
        // Carrega o tema salvo ao abrir a página
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('sifrota_theme') || 'dark'; // Padrão é escuro
            document.documentElement.setAttribute('data-theme', savedTheme);
        });
    </script>
</body>
</html>
