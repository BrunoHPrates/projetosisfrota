<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Sifrota - Modelos</title>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape-ring-bw"></div>
        <div class="shape-ring-orange"></div>
        <div class="shape-glow"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-glass mb-4 position-relative">
        <div class="container">
            <a class="navbar-brand" href="index.html" style="color: var(--accent-orange); font-weight: bold;">Sifrota Web</a>
            <button class="btn btn-sm btn-orange ms-auto" onclick="toggleTheme()">🌓 Alternar Tema</button>
        </div>
    </nav>

    <div class="container glass-effect p-4 mb-4 position-relative">
        <div class="d-flex justify-content-between mb-4 align-items-center">
            <h2 style="font-weight: bold;">🚘 Gestão de <span style="color: var(--accent-orange);">Modelos</span></h2>
            <button class="btn btn-orange" data-bs-toggle="modal" data-bs-target="#modalModelo">Novo Modelo</button>
        </div>
        
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalModelo" tabindex="-1">
        <div class="modal-dialog">
            <form id="formModelo" class="modal-content glass-effect p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="modalTitulo" style="color: var(--accent-orange); font-weight: bold;">Novo Modelo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: invert(1);"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="idField">
                    <input type="text" id="nomeField" class="form-control mb-3" placeholder="Nome do Modelo" required>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-orange w-100">Salvar no Xano</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/controllers/modeloController.js"></script>

    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('sifrota_theme', newTheme);
        }
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('sifrota_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        });
    </script>
</body>
</html>
